[project]
name = "ai-clipping-software"
version = "2.0.0"
description = "AI viral-clip generator: transcript-driven selection, face-tracked reframing, animated captions"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: needs ffmpeg and renders real video"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "B905"]
